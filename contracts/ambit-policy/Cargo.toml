[package]
name = "ambit-policy"
description = "Ambit policy: payee allow-list and cap per payment for OpenZeppelin smart accounts, transfer only."
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
ed25519-dalek = "2.2.0"
proptest = "1"
soroban-sdk = { workspace = true, features = ["testutils"] }
